name: Standards evidence structural audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "build4/**"
      - "intelligence/**"
      - "hosted_cao/**"
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/government-grants/**"
      - "knowledge/borrowing-costs/**"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "orchestration/**"
      - "tests/**"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"
      - ".github/workflows/standards-evidence.yml"
  push:
    branches: [phase-3/government-grants-assistance, phase-3/borrowing-costs-accounting, persistence/durable-cao-integration-flagship, persistence/company-accounting-memory-promotion, persistence/durable-rework-recovery, persistence/durable-case-foundation, orchestration/multi-entity-multi-period-flagship, orchestration/intercompany-framework-currency, orchestration/case-period-invalidation, main, orchestration/saas-close-flagship, orchestration/treasury-financing-flagship, orchestration/group-accounting-flagship]
    paths:
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/government-grants/**"
      - "knowledge/borrowing-costs/**"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "orchestration/**"
      - "tests/**"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate claim registers
        run: python knowledge/standards-evidence/validate_claims.py
      - name: Government grants supplemental knowledge
        run: |
          python knowledge/government-grants/validate_supplement.py
          python -m unittest discover -s knowledge/government-grants -p "test_*.py"
      - name: Borrowing costs supplemental knowledge
        run: |
          python knowledge/borrowing-costs/validate_supplement.py
          python -m unittest discover -s knowledge/borrowing-costs -p "test*.py"
      - name: Validate canonical approval contract
        run: python knowledge/standards-evidence/validate_approvals.py
      - name: Test accounting regressions and public output boundary contract
        run: python -m unittest discover -s tests -p "test_*.py"
