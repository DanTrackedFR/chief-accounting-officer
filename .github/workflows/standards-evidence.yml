name: Standards evidence structural audit

on:
  pull_request:
    paths:
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "orchestration/**"
      - "tests/**"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"
      - ".github/workflows/standards-evidence.yml"
  push:
    branches: [persistence/durable-cao-integration-flagship, persistence/company-accounting-memory-promotion, persistence/durable-rework-recovery, persistence/durable-case-foundation, orchestration/multi-entity-multi-period-flagship, orchestration/intercompany-framework-currency, orchestration/case-period-invalidation, main, orchestration/saas-close-flagship, orchestration/treasury-financing-flagship, orchestration/group-accounting-flagship]
    paths:
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "orchestration/**"
      - "tests/**"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate claim registers
        run: python knowledge/standards-evidence/validate_claims.py
      - name: Validate canonical approval contract
        run: python knowledge/standards-evidence/validate_approvals.py
      - name: Test accounting regressions and public output boundary contract
        run: python -m unittest discover -s tests -p "test_*.py"
