name: Standards evidence structural audit

on:
  pull_request:
    paths:
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "tests/test_public_output.py"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"
      - ".github/workflows/standards-evidence.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/topics/**/standards-claims.json"
      - "knowledge/standards-evidence/**"
      - "interfaces/**"
      - "tests/test_public_output.py"
      - "knowledge/phase-2e/**"
      - "knowledge/phase-2d-topic-manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate claim registers
        run: python knowledge/standards-evidence/validate_claims.py
      - name: Test public output boundary contract
        run: python -m unittest discover -s tests -p "test_*.py"
