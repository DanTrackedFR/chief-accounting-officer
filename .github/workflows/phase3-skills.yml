name: Phase 3 skill regression

# Run the full skill gate when a PR is explicitly moved to review, and on
# merges/pushes to main. Standalone specialist branches also run on push
# so its exact final head can pass before the Draft PR is marked ready.
on:
  pull_request:
    types: [ready_for_review, reopened]
    paths:
      - "hosted_cao/**"
      - "skills/**"
      - "knowledge/income-taxes/**"
      - "knowledge/agriculture/**"
      - "knowledge/inventory-cost/**"
      - "knowledge/derivatives-hedge/**"
      - "knowledge/insurance-contracts/**"
      - ".github/workflows/phase3-skills.yml"
  push:
    branches: [persistence/durable-cao-integration-flagship, persistence/company-accounting-memory-promotion, persistence/durable-rework-recovery, persistence/durable-case-foundation, orchestration/multi-entity-multi-period-flagship, orchestration/intercompany-framework-currency, orchestration/case-period-invalidation, main, orchestration/saas-close-flagship, orchestration/treasury-financing-flagship, orchestration/group-accounting-flagship, orchestration/scope-repeated-owner-foundation, phase-3/agriculture-biological-assets, phase-3/inventory-cost-accounting, phase-3/derivatives-hedge-accounting, phase-3/insurance-contracts-accounting]
    paths:
      - "orchestration/**"
      - "skills/**"
      - "knowledge/income-taxes/**"
      - "knowledge/agriculture/**"
      - "knowledge/inventory-cost/**"
      - "knowledge/derivatives-hedge/**"
      - "knowledge/insurance-contracts/**"
      - ".github/workflows/phase3-skills.yml"
  workflow_dispatch:

concurrency:
  group: phase3-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase 3 skill tests
        run: |
          python -m unittest discover -s skills/lease-accounting/tests -p "test_*.py"
          python -m unittest discover -s skills/tests -p "test_*.py"
          python knowledge/income-taxes/test_supplement.py
          python knowledge/income-taxes/validate_supplement.py
          python knowledge/agriculture/validate_supplement.py
          python knowledge/agriculture/test_supplement.py
          python knowledge/agriculture/test_independent_claim_qa.py
          python knowledge/insurance-contracts/validate_supplement.py
          python -m unittest discover -s knowledge/insurance-contracts -p "test*.py"
          python knowledge/derivatives-hedge/validate_supplement.py
          python -m unittest discover -s knowledge/derivatives-hedge -p "test*.py"
          python knowledge/derivatives-hedge/independent_review_tests.py
          python knowledge/inventory-cost/validate_supplement.py
          python -m unittest discover -s knowledge/inventory-cost -p "test*.py"
      - name: Repository regression
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Standards evidence validation
        run: python knowledge/standards-evidence/validate_claims.py && python knowledge/standards-evidence/validate_approvals.py
